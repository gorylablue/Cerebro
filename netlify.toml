# Netlify publica la carpeta tal cual: no hay paso de compilación.
[build]
  publish = "."
  command = ""
  # Ahorro de créditos: solo publica la rama main y solo si cambió la app (no notas, skills ni pruebas).
  ignore = "[ \"$BRANCH\" != \"main\" ] || git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)*.md' ':(exclude).claude' ':(exclude)tests'"

# Función privada que guarda la copia para la revisión de Claude.
[functions]
  directory = "netlify/functions"

# El service worker y el HTML siempre se revisan para que las actualizaciones lleguen rápido.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# HTML, JS y CSS se revalidan siempre: las actualizaciones llegan en la siguiente apertura.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
